name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          import forgetted

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}", "release tag must match pyproject.toml"
          assert forgetted.__version__ == version, "package and project versions must match"
          PY
      - name: Build and validate distribution artifacts
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          python -m venv .package-smoke
          . .package-smoke/bin/activate
          python -m pip install --no-deps dist/*.whl
          python -c 'import forgetted; print(forgetted.__version__)'
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
